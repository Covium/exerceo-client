name: APK

on:
  workflow_dispatch:
    inputs:
      action:
        description: Build an APK, or bump the version and publish a GitHub Release
        type: choice
        options:
          - build
          - release
        default: build
      bump:
        description: Semver bump when action is release
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

env:
  VITE_API_URL: https://exerceo.covium.tech/api

jobs:
  apk:
    runs-on: ubuntu-latest
    concurrency:
      group: exerceo-apk-${{ github.event.inputs.action }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Next version
        id: version
        env:
          MODE: ${{ github.event.inputs.action == 'release' && github.event.inputs.bump || 'current' }}
        run: |
          chmod +x .github/scripts/next-version.sh
          .github/scripts/next-version.sh "$MODE" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web assets
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run android:assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Load release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD as repository secrets."
            exit 1
          fi
          mkdir -p "$HOME/secrets"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$HOME/secrets/exerceo-release.jks"
          echo "ANDROID_KEYSTORE_FILE=$HOME/secrets/exerceo-release.jks" >> "$GITHUB_ENV"

      - name: Assemble release APK
        working-directory: android
        env:
          EXERCEO_VERSION: ${{ steps.version.outputs.version }}
          EXERCEO_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease

      - name: Name APK
        id: apk
        run: |
          src="android/app/build/outputs/apk/release/app-release.apk"
          dest="android/app/build/outputs/apk/release/exerceo-${{ steps.version.outputs.version }}.apk"
          mv "$src" "$dest"
          echo "apk=$dest" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: exerceo-apk
          path: ${{ steps.apk.outputs.apk }}

      - name: GitHub Release
        if: github.event.inputs.action == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.apk.outputs.apk }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
