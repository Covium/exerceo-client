name: Web

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Copy the build to /var/www/exerceo
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: exerceo-web-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: /api

      - uses: actions/upload-artifact@v4
        with:
          name: exerceo-web
          path: frontend/dist

      - name: Pack dist
        if: github.event.inputs.deploy == 'true'
        run: tar -C frontend/dist -czf dist.tar.gz .

      - name: Copy dist archive
        if: github.event.inputs.deploy == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: dist.tar.gz
          target: /tmp/exerceo-web
          overwrite: true

      - name: Publish to /var/www/exerceo
        if: github.event.inputs.deploy == 'true'
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_WEB_PATH: ${{ vars.DEPLOY_WEB_PATH || '/var/www/exerceo' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: DEPLOY_WEB_PATH
          script: |
            set -eu
            mkdir -p "$DEPLOY_WEB_PATH"
            tmp="$(mktemp -d)"
            tar -xzf /tmp/exerceo-web/dist.tar.gz -C "$tmp"
            find "$DEPLOY_WEB_PATH" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a "$tmp"/. "$DEPLOY_WEB_PATH"
            rm -rf "$tmp" /tmp/exerceo-web/dist.tar.gz
            if command -v nginx >/dev/null 2>&1; then
              sudo nginx -t && sudo systemctl reload nginx || true
            fi
